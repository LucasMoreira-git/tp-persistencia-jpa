schema: spec-driven

context: |
  Proyecto: E-Commerce Refactor (Lombok & DTOs) - Programación III.
  Stack: Java 17, Gradle, Lombok, Jakarta Persistence / Hibernate, MySQL (XAMPP).
  Negocio: Dominio de Pedidos, Productos, Categorías y Usuarios.
  Modelo: Clase abstracta Base -> heredan Usuario, Pedido, Categoria, Producto, DetallePedido.
  Objetivo: Eliminar código repetitivo usando anotaciones Lombok (@SuperBuilder, @Data) y ocultar campos sensibles con Java Records (UsuarioDTO).
  Entorno: Windows, VS Code con Antigravity CLI / OpenCode.

rules:
  proposal:
    - Mantener la propuesta enfocado únicamente en la migración a Gradle y refactorización a Lombok/DTO.
  tasks:
    - Dividir en tareas pequeñas por módulo (ej. build.gradle, entidades, DTO, Main).
    - Modificar archivos existentes agregando anotaciones de Lombok sin borrar métodos de negocio existentes (ej. calcularTotal).
  design:
    - Usar @SuperBuilder en la jerarquía de herencia para permitir el uso del patrón Builder en las subclases.
    - Utilizar Java Record para la definición de UsuarioDTO.